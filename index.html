<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday</title>
    <meta name="description" content="Only for you!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://www.webkaizen.in">
    <link rel="stylesheet" href="https://www.webkaizen.in/products">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <canvas id="matrix-rain" style="display:none;"></canvas>

    <video id="book-bg-video" src="Generated Video September 24, 2026 - 2_15PM.mp4" autoplay loop muted playsinline
        style="display:none; opacity:0;"></video>

    <canvas style="position:absolute;width:100%;height:100%;z-index:9999;display:none;" class="canvas"></canvas>

    <div class="overlay">

        <div class="stars-container" id="starsContainer"></div>

        <img id="gift-image" src="image/happy3.gif"
            style="display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10000;max-width:80%;max-height:80%;" />

        <div class="content-display" id="contentDisplay">
            <p id="contentText"></p>
        </div>

        <div class="firework-container" id="fireworkContainer"></div>

        <div class="book-container">
            <div class="book" id="book"></div>
        </div>

        <button class="music-control" id="musicControl" title="Play/Pause Music">▶</button>

        <button id="fullscreenBtn" style="
            position:fixed;bottom:20px;right:20px;z-index:990010;
            padding:10px 18px;border-radius:8px;border:none;
            background:#222;color:#fff;font-size:16px;
            box-shadow:0 2px 8px rgba(0,0,0,0.15);cursor:pointer;display:none;">
            <img style="width:20px;height:20px;vertical-align:middle;" src="image/full.png" alt="⛶">
        </button>
        <audio id="birthdayAudio" loop>
            <source src="assets/music.mp3" type="audio/mpeg">
        </audio>

        <div id="orientation-lock">
            <div class="phone-icon">
                <img src="image/screen.png" alt="">
            </div>
        </div>

    </div>
    <script src="jscp/anti-devtools.js"></script>
    <script src="jscp/settings.js"></script>
    <script src="jscp/ui.js"></script>

</body>

</html>
